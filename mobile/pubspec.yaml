name: digi_law_reporter_mobile
description: "Digi Law Reporter - Verified Legal Judgment Research Mobile Application for iOS & Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  pdf: ^3.13.0
  printing: ^5.15.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hero_bg.jpg
    - assets/logo.png

  fonts:
    - family: Times New Roman
      fonts:
        - asset: assets/fonts/TimesNewRoman-Regular.ttf
          weight: 400
        - asset: assets/fonts/TimesNewRoman-Bold.ttf
          weight: 700
        - asset: assets/fonts/TimesNewRoman-Italic.ttf
          style: italic
        - asset: assets/fonts/TimesNewRoman-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
